# 26赛季 VCU-工控机 CAN 协议
# 镜像自: WUTA-FSD/ros2_ws/src/system/can_interface/docs_for_can/26赛季 VCU - 工控机 CAN通信协议规划.md
# hil_test 编解码与断言统一入口；协议变更只改本文件

# 工控机 → VCU（发送）
tx_210:
  id: 0x210
  period_ms: 100          # 10Hz 保活（首份 devices_inspection 后开闸，开闸前静默）
  dlc: 8
  max_steer_deg: 25.0     # Signal2 满量程转向角（与 can_interface max_steer_deg 一致）
  signals:
    longitudinal:         # Signal1 纵向控制（<32767 制动、>32767 驱动）Byte1-2
      bytes: [0, 1]
      little_endian: true
      center: 32767
      min: 10
      max: 65525
    lateral:              # Signal2 横向控制（0=满左、65535=满右，中心 32762）Byte3-4
      bytes: [2, 3]
      little_endian: true
      center: 32762
      min: 0
      max: 65535
    online:               # Signal3 工控机上线 Byte5
      byte: 4
    finished:             # Signal4 任务已完成 Byte6
      byte: 5

# 工控机 → VCU（发送）：上线心跳
# 与 0x210 Signal3 同源（can_interface 的 can_online_，即 /system/devices_inspection.ok），
# 但独立成帧且不受 0x210 开闸门控：节点启动即发，首份自检结论前 Data[0]=0x00。
tx_301:
  id: 0x301
  dlc: 1                  # 只发 1 字节
  period_ms: 50           # 20Hz
  online_byte: 0          # Data[0]
  online_value: 0x01      # 正常/在线
  offline_value: 0x00     # 异常/离线（含首份自检结论未到）

# VCU → 工控机（接收）
rx_501:
  id: 0x501
  # 实测（2026-10-03 台架，BusMonitor 落盘统计）：VCU 以 10Hz 周期重发当前模式字节，
  # 载荷恒定（106 帧/10.5s，周期 0.095~0.106s，如 06 00 00 00 00 00 00 00）。
  # 即模式是「电平」信号而非事件——can_interface 的去重只应作用于转发时机，
  # 不能假定"只发一次"；晚启动的 mission_manager 需要靠保活重发追上。
  dlc: 8
  # 新协议：取消原 Byte1「VCU 状态」定义，原 Byte2「测试模式」提升到 Byte1
  mode_byte: 0            # Byte1: 测试模式
  mode_topic_map:         # Byte1 → mission_mode_cmd 字符串；null = 忽略
    1: null               # 操控性测试（有人驾驶，与无人算法无关）
    2: acceleration
    3: trackdrive
    4: skidpad
    5: ebs_test
    6: inspection

# RES 遥控器 → 工控机（接收）：发车放行与急停
# 实测（2026-10-03 zlgcan_bridge 抓包 log/20261003_203934/vcu2fsd/0x1E4.log）：
#   - 33.3Hz 周期电平广播（中位 30ms，P10/P90 = 26/34ms）；桥侧 DLC 记为 8（协议文档写 3）
#   - 0x11 遥控器上线：长电平（数十秒~上千秒）
#   - 0x13 发车按钮：瞬时脉冲（实测 0.15~0.51s）
#   - 0x10 急停：持续电平（实测 9.6~475s）
#   - 0x00 遥控器未上线（不在三态定义内，FSD 侧忽略）
# can_interface 只读 Byte1（dlc>=1 即可），故这里以协议文档的 dlc=3 为准。
rx_1e4:
  id: 0x1E4
  dlc: 3                 # 标准帧 / 500k；实测桥日志 dlc=8，解码不依赖 dlc
  byte: 0                # Byte1：RES 状态
  period_ms: 30          # 实测广播周期（vcu_sim 按此模拟）
  state_map:
    0x11: online         # 遥控器上线
    0x13: start          # 发车按钮被按下 → /system/start_command
    0x10: estop          # 按下急停 → /system/emergency（锁存）
