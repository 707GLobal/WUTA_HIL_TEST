# CAN 设备与测试参数
can:
  interface: can0        # SocketCAN 接口（真实 USB-CAN 接入后按实际名称修改，如 can0/can1/...）
  bitrate: 500000        # 波特率
  sim_interfaces:        # 仿真接口列表：匹配则自动起 vcu_sim / 允许 0x501 注入
    - vcan0

bench:
  # L3 台架安全限速（唯一旋钮，先低后调）。台架反馈车速代发为 0，
  # 该值经 waypoints 成为 controller 目标速度，并近似等比例决定纵向开度，
  # 故须保持低位以免架起的轮子高速空转。L4 车检速度不走这里，
  # 取 FSD controller.yaml 的 inspection_throttle（恒定开度，不走 PID）/ inspection_steer_*。
  target_speed_mps: 0.2

  # RES 发车放行（0x1E4 Byte1=0x13）：不按 GO，VCU 不执行 0x210 指令。
  # 测试直接等总线上的 0x1E4 发车帧（不经 FSD 转述）。
  res_go_timeout_sec: 600.0  # 等人工按 RES 发车按钮的超时（s），超过即用例失败（L3/L4 共用）

  # L4 车检到 FINISH 后、脚本下 FSD（用例 teardown 停 mission_manager → 脚本停
  # can_interface/controller）之前，保持整条链路在线的时间（s）。给现场留观察/确认
  # 窗口，避免车检一完成节点就没了；0=不保持（立即收尾）。仅 L4 生效。
  # 现场临时改：HIL_POST_FINISH_HOLD_SEC=10 ./scripts/hil_test.sh -l L4 -i can0 -n
  post_finish_hold_sec: 30.0

test:
  frames:
    - id: 0x210          # 工控机→VCU 10Hz 保活（本机职责，周期可判定）
    - id: 0x301          # 工控机→VCU 上线心跳（20Hz，DLC=1；本机职责，周期可判定）
    - id: 0x501          # VCU→工控机 模式帧（实测 10Hz 周期重发同一档位，不判周期）
    - id: 0x1E4          # RES→工控机 遥控器状态帧（实测 33.3Hz 周期电平广播）
  period_tolerance_ratio: 0.2  # 周期容差（±20%），适用于 0x210 保活与 0x301 心跳
  ros_timeout_sec: 5.0         # ROS 话题等待/断言超时
